# Deploys the AI note backend (worker/) to Cloudflare whenever it changes on main.
# Needs three repository secrets: ANTHROPIC_API_KEY (or WEATHER_NOTE), CLOUDFLARE_API_TOKEN. The account ID lives in worker/wrangler.toml.
name: Deploy note backend
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-note-backend.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check secrets are set
        id: secrets
        env:
          A: ${{ secrets.ANTHROPIC_API_KEY || secrets.WEATHER_NOTE }}
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=""
          [ -z "$A" ] && missing="$missing ANTHROPIC_API_KEY (or WEATHER_NOTE)"
          [ -z "$T" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::warning::Skipping deploy. Missing repository secrets:$missing (Settings > Secrets and variables > Actions)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cloudflare/wrangler-action@v3
        if: steps.secrets.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: 4.156.0
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.WEATHER_NOTE }}
